<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Reproducible experiments in graph communities, simulated influence and missing-link recovery."
    />
    <title>Network Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <a href="/">Network Explorer</a>
      <nav aria-label="External links">
        <a href="https://github.com/m21264551-arch/network-analysis">Code ↗</a
        ><a href="https://m21264551.com">Portfolio ↗</a>
      </nav>
    </header>
    <main>
      <h1>Explore communities, influence, and missing links.</h1>
      <div class="dataset">
        <label for="dataset">Dataset</label
        ><select id="dataset" disabled></select
        ><span id="counts"></span
        ><button id="download" disabled>Download data ↓</button>
      </div>
      <p id="description"></p>
      <nav id="views" aria-label="Experiments">
        <button disabled data-view="groups" aria-pressed="true">
          Communities</button
        ><button disabled data-view="influence" aria-pressed="false">
          Influence</button
        ><button disabled data-view="links" aria-pressed="false">
          Link recovery</button
        ><button disabled data-view="method" aria-pressed="false">
          Method
        </button>
      </nav>
      <div id="status" role="status">Loading experiments…</div>
      <div id="workspace" hidden></div>
      <noscript
        >This explorer needs JavaScript. The complete
        <a href="data/experiments.json">experiment JSON</a> is available without
        it.</noscript
      >
      <footer id="provenance"></footer>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
